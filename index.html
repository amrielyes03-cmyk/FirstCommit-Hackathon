<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anistack - Anime & Manga Hub</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Domine:wght@400..700&family=Source+Code+Pro:ital,wght@0,200..900;1,200..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="header">
        <div class="logo">
            <h1>Ani<span>stack</span></h1>
        </div>

        <form class="search-form" id="search-form">
            <input type="text" id="search-input" placeholder="Search for Anime...">
            <button type="submit">Search</button>
        </form>

          <div class="filter-buttons">
            <button class="filter-btn active" data-filter="airing">Top Airing</button>
            <button class="filter-btn" data-filter="upcoming">Upcoming</button>
            <button class="filter-btn" data-filter="bypopularity">Most Popular</button>
        </div>
    </header>

    <main id="anime-grid" class="anime-grid"></main>

    <script src="script.js"></script>
</body>
</html>
